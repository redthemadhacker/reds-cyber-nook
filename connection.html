<head>

    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <title>Red's Cyber Nook</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/6783/6783360.png">


    <style>

        
        html, body {
           margin: 0;
           padding: 0;
           height: 100%;
           width: 100%;
        }

        body {
           background-repeat: no-repeat;
           background-position: center;
           background-size: cover;
           background-color: #333333;
           overflow-x: hidden;
           overflow-y: auto; 
           position: relative;
           background-attachment: fixed;
           background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlmxN6k40zOiIy7XiYhx-g9g7WAT-Dm_YbRe3O-KCXGXg2DSBF7Sm8UNd_&s=10");
        }

        .text-box {
            text-align: center;
            position: relative;
            font-family: 'VT323', monospace;
            top: 5%;
            left: 5%;
            color: #000000;
            max-width: 700px;
            transform: translateY(-50%); 
            z-index: 5;
            margin-top: 20px;
        }    
        
        h1 {
           text-align: center;
           font-size: 50px;
           white-space: nowrap;
           border-right: 3px solid #000000;
           animation: typing 0.5s steps(20), blink 0.7s infinite;
        }
        @keyframes typing {
             from { width: 0; }
             to { width: 100%; }
        }

        @keyframes blink {
             50% { border-color: transparent; }
        }

        .back-box {
            position: fixed;
            right: 12px;
            bottom: 12px;
            color: #000000;
            font-family: 'VT323', monospace;
            flex-direction: column;
            display: flex;
            text-align: center;
            font-size: 24px;
            z-index: 100;
            gap: 6px;
        }

        .image-map {
            position: relative;
            margin: 0 auto 120px auto;
            width: 90%;
            max-width: 700px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-container {
            position: relative;
            width: 100%;
            display: inline-block;
        }

        .image-map img {
            width: 100%;
            height: auto;
            display: block;
        }

        .spot {
            position: absolute;
            width: 12%;
            height: 25%;
            top: 52%;
            cursor: pointer;
        }

        .spot-resume { left: 4.5%; }
        .spot-phone { left: 29.5%; }
        .spot-email { left: 54.5%; }
        .spot4 { left: 79.5%; }

        .spot:hover {
            box-shadow: 0 0 20px #ff0000;
            border-radius: 50%;
            background: rgba(255,0,0,0.3);
        }         

        .nav-btn {
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.85);
            color: #ff0000;
            border: 2px solid #000000;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #ff0000;
            color: #ffffff;
            border-color: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }

        .nav-btn:active::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                90deg,
                #ff0000,
                #ff0000 2px,
                #000 2px,
                #000 4px
            );
            animation: glitch-explode 1s steps(4);
            opacity: 0.8;
        }

        @keyframes glitch-explode {
            0% { transform: translate(0,0); }
            25% { transform: translate(-6px, 3px); }
            50% { transform: translate(4px, -4px); }
            75% { transform: translate(-3px, 5px); }
            100% { transform: translate(0,0); }
        }

        .image-title {
            font-size: 35px;
            color: #ff0000;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid #ff0000;
            text-align: center;
            white-space: nowrap;
            font-family: 'VT323', monospace;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .image-title {
                font-size: 24px;
                white-space: normal;
            }

            .back-box {
                right: 8px;
                bottom: 8px;
                font-size: 18px;
            }
        }

        @keyframes flyIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>


</head>

    </div>


</body>
