<!DOCTYPE html>
<html lang="en">


<head>


  <meta charset="UTF-8">
  <title>Request Form</title>


  <style>
  body {
  background: #0a0a0a;
  color: #ff0000;
  font-family: 'VT323', monospace;
  padding: 40px;
  text-align: center;
  }

  h1 {
    color: #ff0000;
    margin-bottom: 25px;
  }

  .form {
    width: 100%;
    max-width: 450px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px; 
    background: #111;
    padding: 25px; 
    border-radius: 10px;
    border: 2px solid #ff0000;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
  }

  .label {
    text-align: left;
    font-weight: 600;
    color: #ff0000;
    margin-top: 25px;
    margin-bottom: 6px; 
  }

  .form input,
  .form textarea {
    padding: 10px;
    border: 2px solid #ff0000;
    background: #0a0a0a;
    color: #white;
    border-radius: 6px;
    font-size: 15px;
  }

  .button {
    padding: 12px;
    background: #ff0000;
    color: #fff;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    font-family: 'VT323', monospace;
    transition: background 0.2s ease;
  }

  .button:hover {
    background: #ff3333;
  }


  </style>


</head>


<body>


  <h1>Service Request</h1>


  <form action="https://formspree.io/f/xppalepv" method="POST">

  <div class="form">
    <div class="label">Name</div>
    <input type="text" name="name" required>
  </div>

  <div class="form">
    <div class="label">Email</div>
    <input type="email" name="email" required>
  </div>

  <div class="form">
    <div class="label">Request</div>
    <textarea name="message" required></textarea>
  </div>

  <button class="button">Done</button>
  </form>

  <div id="result"></div>


</body>


</html>
