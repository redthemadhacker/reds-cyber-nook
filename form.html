<!DOCTYPE html>
<html lang="en">


<head>


  <meta charset="UTF-8">
  <title>Request Form</title>


  <style>
  body {
  background: #0a0a0a;
  color: #ff0000;
  font-family: 'VT323', monospace;
  padding: 60px 20px;
  text-align: center;
  }

  h1 {
    color: #ff0000;
    margin-bottom: 25px;
    font-size: 2rem;
    letter-spacing: 1px;
  }

  .form {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px; /* more space between each label/input group */
    background: #111;
    padding: 30px 40px; /* adds space on right side */
    border-radius: 10px;
    border: 1px solid #ff0000;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
  }

  .label {
    text-align: left;
    font-weight: 600;
    color: #ff0000;
    margin-top: 25px;
    margin-bottom: 6px; /* space between label and box */
  }

  .form input,
  .form textarea {
    padding: 12px;
    border: 1px solid #ff0000;
    background: #0a0a0a;
    color: #ff0000;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    width: 80%;
  }

  .form input:focus,
  .form textarea:focus {
    border-color: #ff3333;
    box-shadow: 0 0 6px #ff3333;
  }

  .button {
    padding: 12px;
    margin-top: 15px;
    background: #ff0000;
    color: #fff;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s ease;
  }

  .button:hover {
    background: #ff3333;
  }


  </style>


</head>


<body>


  <h1>Service Request</h1>

  <div 
    
  class="form">

 <form action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="6e00323c-9391-4233-aa63-c54d85a07c7f">

 <form class="form">
  <div class="form-group">
    <div class="label">Name</div>
    <input type="text">
  </div>

  <div class="form-group">
    <div class="label">Email</div>
    <input type="email">
  </div>

  <div class="form-group">
    <div class="label">Message</div>
    <textarea></textarea>
  </div>

  <button class="button">Done</button>
  </form>

    <div id="result"></div>

  </div>

    <script>
    const form = document.querySelector("form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const response = await fetch(form.action, {
        method: form.method,
        body: formData
        });

        const data = await response.json();

        if (data.success) {
        result.innerHTML = "Form submitted successfully!";
        form.reset();
        } else {
        result.innerHTML = "Something went wrong.";
        }
    });
    </script>


    </div>


</body>


</html>
