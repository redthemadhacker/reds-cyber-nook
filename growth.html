    <style>


        html, body {
           margin: 0;
           padding: 0;
           height: 100%;
           width: 100%;
        }

        body {
           background-repeat no-repeat;
           background-position: center;
           background-size: cover;
           background-color: #333333;
           overflow: hidden; 
           position: relative;
           background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6-OMaAal5Ljp8agQJbkM7PBLJFOW_HFdcR8nH3-GvFA&s=10");

        }

        .text-box {
            text-align: center;
            position: relative;
            font-family: 'VT323', monospace;
            top: 5%;
            left: 5%;
            color: #ff0000;
            max-width: 700px;
            transform: translateY(-50%); 
        }    
        
        h1 {
           text-align: center;
           font-size: 50px;
           white-space: nowrap;
           border-right: 3px solid #ff0000;
           animation: typing 05s steps(20), blink 0.7s infinite;
        }
        @keyframes typing {
             from { width: 0; }
             to { width: 100%; }
        }

        @keyframes blink {
             50% { border-color: transparent; }
        }

        .back-box {
            position: fixed;
            right: 12px;
            bottom: 12px;
            color: #ff0000;
            font-family: 'VT323', monospace;
        }

        .growth-container {
            width: 80%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .growth-box {
            opacity: 0;
            width: 400px;
            max-width: 600px;
            min-height: 50px;
            border: 2px solid #ff0000;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            text-align: center;
            animation: flyInSide 0.9s ease-out forwards;
        }

        .growth-box:nth-of-type(1) {
            animation-delay: 1s;
            transform: translateX(-60px);
        }
        .growth-box:nth-of-type(2) {
            animation-delay: 2s;
            transform: translateX(60px);
        }
        .growth-box:nth-of-type(3) {
            animation-delay: 3s;
            transform: translateX(-60px);
        }
        .growth-box:nth-of-type(4) {
            animation-delay: 4s;
            transform: translateX(60px);
        }

        @keyframes flyInSide {
            to {
            opacity: 1;
            transform: translateX(0);
            }
        }

        .columns {
            display: table-column;
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
        }

        .left-column,
        .right-column {
            display: table-column;
            flex-direction: column;
            gap: 20px;
        }

        .left-column .growth-box {
            transform: translateX(-60px);
        }

        .right-column .growth-box {
            transform: translateX(60px);
        }



    </style>


</head>
