<!DOCTYPE html>
<html lang="en">


<head>


    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <title>Red's Cyber Nook</title>


    <style>


        html, body {
           margin: 0;
           padding: 0;
           height: 100%;
           width: 100%;
        }

        body {
           background-repeat no-repeat;
           background-position: center;
           background-size: cover;
           background-color: #333333;
           overflow: hidden; 
           position: relative;
           background-image: url("https://www.growqai.com/_next/image?url=%2Fimages%2Fsplash-bg.png&w=3840&q=75&dpl=dpl_5fFvhbSDxpHER2ADCoiY1BiiQX3z");
        }

        .text-box {
            text-align: center;
            position: relative;
            font-family: 'VT323', monospace;
            top: 5%;
            left: 5%;
            color: #ff0000;
            max-width: 700px;
            transform: translateY(-50%); 
        }    
        
        h1 {
           text-align: center;
           font-size: 50px;
           white-space: nowrap;
           border-right: 3px solid #ff0000;
           animation: typing 05s steps(20), blink 0.7s infinite;
        }
        @keyframes typing {
             from { width: 0; }
             to { width: 100%; }
        }

        @keyframes blink {
             50% { border-color: transparent; }
        }

        .back-box {
            position: fixed;
            right: 12px;
            bottom: 12px;
            color: #ff0000;
            font-family: 'VT323', monospace;
        }

        .growth-section {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 50px;
        }

        .growth-box {
            flex-wrap: nowrap;
            justify-content: center;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            display: flex;
        }

        .freelance-item {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ff0000;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-wrap: nowrap;
        }

        .freelance-item h3 {
            font-family: 'VT323', monospace;
            font-size: 1.6rem;
            color: #ff0000;
            margin-bottom: 10px;
        }

        .freelance-item p {
            font-family: 'VT323', monospace;
            font-size: 1rem;
            color: #ffffff;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .service-btn {
            display: inline-block;
            padding: 8px 14px;
            border: 1px solid #ff0000;
            color: #ff0000;
            font-family: 'VT323', monospace;
            text-decoration: none;
            transition: 0.2s;
        }

        .service-btn:hover {
            background: #ff0000;
            color: #000;
        }

        .growth-links {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 50px;
        }

        .growth-title {
            font-family: 'VT323', monospace;
            font-size: clamp(2rem, 4vw, 3rem);
            color: #ff0000;
            margin-bottom: 25px;
        }

        .growth-links-box {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .growth-link {
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            color: #ff0000;
            text-decoration: none;
            border: 1px solid #ff0000;
            padding: 10px 15px;
            display: inline-block;
            transition: 0.2s;
        }

        .growth-link:hover {
            background: #ff0000;
            color: #000;
        }

        .cert-section {
            margin-top: 20px;
        }

        .cert-title {
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            color: #ff0000;
            margin-bottom: 20px;
        }

        .cert-item {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ff0000;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .cert-item h4 {
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            color: #ff0000;
            margin-bottom: 10px;
        }

        .cert-item p {
            font-family: 'VT323', monospace;
            font-size: 1rem;
            color: #ffffff;
            line-height: 1.4;
        }

        .growth-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }     

        .box {
            flex: 1 1 300px;          
            max-width: 320px;         
            min-height: 250px;        
            border: 2px solid #ff0000;
            background-color: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 10px #ff0000;
            padding: 20px;
            color: #ff0000;
            display: flex;
            flex-direction: column;   
            justify-content: space-between;
            text-align: center;
            width: 90%;
            max-width: none;
        }

        @media (max-width: 768px) {
          .growth-container {
            flex-direction: column;
            align-items: center;
        }

    </style>


</head>


<body>

            <a href="index.html" class="nav-btn">Back to Nook</a>

        </div>
        
    </div>


</body>
