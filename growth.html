<!DOCTYPE html>
<html lang="en">


<head>


    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <title>Red's Cyber Nook</title>


    <style>
        html, body {
           margin: 0;
           padding: 0;
           height: 100%;
           width: 100%;
        }

        body {
           background-repeat no-repeat;
           background-position: center;
           background-size: cover;
           background-color: #333333;
           overflow: hidden; 
           position: relative;
           background-image: url("https://www.growqai.com/_next/image?url=%2Fimages%2Fsplash-bg.png&w=3840&q=75&dpl=dpl_5fFvhbSDxpHER2ADCoiY1BiiQX3z");
        }

        .text-box {
            text-align: center;
            position: absolute;
            font-family: 'VT323', monospace;
            top: 5%;
            left: 5%;
            color: #ff0000;
            max-width: 700px;
            transform: translateY(-50%); 
        }    
        
        h1 {
           text-align: center;
           font-size: 50px;
           white-space: nowrap;
           border-right: 3px solid #ff0000;
           animation: typing 05s steps(20), blink 0.7s infinite;
        }
        @keyframes typing {
             from { width: 0; }
             to { width: 100%; }
        }

        @keyframes blink {
             50% { border-color: transparent; }
        }

        .back-box {
            position: fixed;
            right: 145px;
            top: 12px;
            color: #ff0000;
            font-family: 'VT323', monospace;
        }


    </style>


</head>


<body>


    <div 
    
    class="text-box">
         <h1>Growth Hub</h1>

    </div>

    <div
    
    class="back-box">
         <a href="index.html" class="nav-btn">Back to Nook</a>

    </div>


</body>


</html>
